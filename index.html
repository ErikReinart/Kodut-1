<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PostIt - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" id="home">Home</a>
      <a href="addPost.html" id="add">Add Post</a>
    </div>
    <div class="nav-right">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" onclick="dropdownMenu()" alt="profile" class="profile">
        <div id="dropdownMenu" class="dropdown">
            <p>John Doe</p>
            <p>john.doe@ut.ee</p>
            <p>logout</p>
        </div>
    </div>
  </header>



  <div class="page-wrapper">
    <div class="leftside"></div>

    <main class="feed" id="feed">
      <template id="postTemplate">
        <div class="post">
            <div class="post-header">
                <img class="profile" alt="profile">
                <span class="username"></span>
                <span class="date"></span>
            </div>
    
        <div class="post-image">
            <img alt="post image">
        </div>
        <p class"likes"></p>

        <div class="like">
            <button>👍</button>
        </div>
      </div>
      </template>
    </main>
        
    <div class="rightside"></div>
  </div>

  <footer>Footer</footer>

  <script src="script.js"></script>
</body>
</html>
