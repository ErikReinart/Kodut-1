<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - PostIt</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function validateLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) {
        alert('Please fill in both fields.');
        return false;
      }
      window.location.href = "index.html";
      return false;
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a id="home" href="index.html">Home</a>
      <a id="add" href="addPost.html">Add Post</a>
    </div>
    <div class="nav-right">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" onclick="dropdownMenu()" alt="profile" class="profile">
        <div id="dropdownMenu" class="dropdown">
            <p>John Doe</p>
            <p>john.doe@ut.ee</p>
            <p>logout</p>
        </div>
  </nav>

  <div class="center-box">
    <div class="form">
      <h2>Welcome to PostIt</h2>
      <a href="register.html" class="small-link">Create an account</a>
      <p>or</p>
      <p>Please log in</p>

    <form onsubmit="return validateLogin()">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
      
    <a href="#" class="small-link">Forget password</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
